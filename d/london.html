<script>
(function () {
  var D = window.SHARE;
  var toast = document.getElementById('toast');
  function say(msg) { toast.textContent = msg; toast.classList.add('show'); setTimeout(function () { toast.classList.remove('show'); }, 2000); }
  function copy() {
    var t = D.caption + '\n' + D.pageUrl;
    if (navigator.clipboard) { navigator.clipboard.writeText(t).then(function () { say('Link copied'); }, function () { say(D.pageUrl); }); }
    else { say(D.pageUrl); }
  }
  document.getElementById('share').addEventListener('click', async function () {
    try {
      var blob = await (await fetch(D.imageUrl)).blob();
      var file = new File([blob], D.fileName, { type: 'image/jpeg' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: D.title, text: D.caption });
        return;
      }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    if (navigator.share) {
      try { await navigator.share({ title: D.title, text: D.caption, url: D.pageUrl }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    copy();
  });
  var c = document.getElementById('copy');
  if (c) c.addEventListener('click', function (e) { e.preventDefault(); copy(); });
})();
</script>
